name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated workload test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libcap-dev python3
          git init "$RUNNER_TEMP/bubblewrap-source"
          git -C "$RUNNER_TEMP/bubblewrap-source" fetch --depth=1 https://github.com/containers/bubblewrap 719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0
          git -C "$RUNNER_TEMP/bubblewrap-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bubblewrap-source" rev-parse HEAD)" = 719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0
          meson setup "$RUNNER_TEMP/bubblewrap-build" "$RUNNER_TEMP/bubblewrap-source" -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bubblewrap-build"
          sudo install -m 0755 "$RUNNER_TEMP/bubblewrap-build/bwrap" /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
      - name: Test mechanisms and actual workload isolation
        run: cargo +1.97 test --locked --all-features
      - name: Check source formatting
        run: cargo +1.97 fmt --all -- --check
      - name: Check all public source targets
        run: cargo +1.97 clippy --locked --all-targets --all-features -- -D warnings
